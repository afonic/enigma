<meta property="og:site_name" content="{{ site_config:site_name }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ title }} | {{ site_config:site_name }}">
<meta property="og:url" content="{{ current_url }}">
{{ if site_config:meta_description }}
<meta property="og:description" content="{{ site_config:meta_description }}">
{{ /if }}
{{ if site_config:social_image }}
<meta property="og:image" content="{{ glide:site_config:social_image width='1200' height='630' fit='crop_focal' absolute="true" }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
{{ /if }}
