<template x-teleport="body">
    <div 
        class="bg-black bg-opacity-20 fixed left-0 top-0 w-full h-full flex items-center justify-center z-50 pointer-events-auto"
        role="dialog"
        tabindex="-1"
        x-show="open"
        x-cloak
        x-transition
        x-on:keyup.escape.window="open = false"
    >
        <div 
            class="relative bg-white rounded shadow w-11/12 max-auto max-h-[90%]"
            x-on:click.away="open = false"
        >
            <div class="m-0 w-full h-[90vh] relative">
                <iframe src="{{ site_config:google_maps_embed }}" width="100%" height="450" frameborder="0" class="absolute top-0 left-0 w-full h-full">
                </iframe>
            </div>
            <div class="absolute flex items-center justify-center right-3 top-3 h-10 w-10 bg-white rounded-lg shadow z-10 cursor-pointer" x-on:click="open = false">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-x"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
        </div>        
    </div>
</template>
