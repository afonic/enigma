{{ form:create in="{ form_field:handle }" x-data="formHandler" x-ref="form" @submit.prevent="formSubmit" }}
<div 
    class="flex flex-wrap" 
    x-data="formFields({{ fields | to_json | entities }})" 
    x-modelable="submitFields" 
    x-model="submitData" 
    x-show="! successMessage" 
    x-transition.opacity
>
    <template x-for="field in fields" x-bind:key="field.handle">
        <div x-bind:class="width(field.width)" class="lg:pr-4 py-3 lg:py-4">
            <template x-if="field.instructions !== 'hide_display'">
                <div class="flex items-center">
                    <label class="font-bold uppercase" x-text="field.display" x-bind:for="field.handle"></label>
                    <template x-if="field.append">
                        <span class="ml-2 text-sm" x-text="field.append"></span>
                    </template>
                </div>
            </template>      
            <template x-if="fieldType(field) == 'text'">
                <div class="mt-2">
                    {{ partial:form/fieldtypes/text }}
                </div>
            </template>
            <template x-if="fieldType(field) == 'date'">
                <div class="mt-2">
                    {{ partial:form/fieldtypes/date }}
                </div>
            </template>
            <template x-if="fieldType(field) == 'time'">
                <div class="mt-2">
                    {{ partial:form/fieldtypes/time }}
                </div>
            </template>
            <template x-if="fieldType(field) == 'radio'">
                <div class="mt-2">
                    {{ partial:form/fieldtypes/radio }}
                </div>
            </template>
            <template x-if="fieldType(field) == 'checkboxes'">
                <div class="mt-2">
                    {{ partial:form/fieldtypes/checkboxes }}
                </div>
            </template>
            <template x-if="fieldType(field) == 'textarea'">
                <div class="mt-2">
                    {{ partial:form/fieldtypes/textarea }}
                </div>
            </template>
            <div class="text-sm mt-1 text-red-600" x-show="field.handle in errors" x-text="errors[field.handle]" x-transition></div>
        </div>
    </template>
    <div class="w-full">
        <div class="my-1 text-center text-red-600" x-show="fatalError" x-cloak>There is a technical problem with our form. Please contact us using email.</div>
    </div>
    <div class="w-full py-4 pr-4">
        <button 
            class="w-full p-2 text-center uppercase font-bold rounded border border-main bg-main text-white 
                        transition-colors duration-500 hover:bg-transparent hover:text-black" 
            type="submit"
            x-bind:disabled="disableSubmit"
        >
            Send request
        </button>
    </div>
</div>
<div class="text-2xl text-center my-4" x-show="successMessage" x-transition.opacity x-cloak x-text="successMessage"></div>
{{ /form:create }}

{{ push:scripts }}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('formFields', (fields) => ({
            init() {
                this.fields = fields
                let formFields = {}            
                for (const field of fields) {
                    Object.assign(formFields, {[field.handle]: ''})
                }
                this.submitFields = formFields
            },

            submitFields: {},
            fields: [],

            fieldType(field) {
                if (field.input_type == 'text' && field.type == 'text') {
                    return 'text'
                }
                if (field.input_type == 'date' && field.type == 'text') {
                    return 'date'
                }
                if (field.input_type == 'time' && field.type == 'text') {
                    return 'time'
                }
                if (field.type == 'radio') {
                    return 'radio'
                }                
                if (field.type == 'checkboxes') {
                    return 'checkboxes'
                }
                if (field.type == 'textarea') {
                    return 'textarea'
                }
            },
            width(percent) {
                if (percent == '100') {
                    return 'w-full'
                }
                if (percent == '50') {
                    return 'w-full xl:w-1/2'
                }
                if (percent == '33') {
                    return 'w-full xl:w-1/3'
                }
                if (percent == '25') {
                    return 'w-full xl:w-1/4'
                }
            }
        }))
        Alpine.data('formHandler', () => ({
            submitData: {},
            errors: {},
            fatalError: false,
            disableSubmit: false,
            successMessage: false,

            toggleSubmit() {
                this.disableSubmit = !this.disableSubmit
            },
            formSubmit() {
                this.clearErrors()
                this.toggleSubmit()

                const url = this.$refs.form.action                
                axios.post(url, this.submitData)
                    .then(response => {
                        this.handleSuccess(response.data)
                    })
                    .catch(error => {
                        this.handleErrors(error.response)
                    })
            },
            handleSuccess(data) {
                if (data.success == true) {
                    this.successMessage = 'Thank you for your message! We will get back to you shortly!'
                }
                fbq('track', 'Contact');
            },
            handleErrors(errors) {
                if (errors.status == 500) {
                    this.fatalError = true
                } else {
                    this.errors = errors.data.error
                }
                this.toggleSubmit()
            },
            clearErrors() {
                this.errors = {}
            }
        }))
    })
</script>
{{ /push:scripts }}
