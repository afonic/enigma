<div class="flex" x-data="radioField" x-modelable="selected" x-model="submitFields[field.handle]">
    <template x-for="(label, id) in field.options">
        <div 
            class="p-2 flex-1 text-center uppercase text-sm font-bold rounded border border-main mr-4 last:mr-0 cursor-pointer transition-colors duration-500"
            x-bind:class="{'bg-main text-white' : id == selected}"
            x-text="label" 
            @click="select(id)"
        >
        </div>
    </template>
</div>

{{ push:scripts }}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('radioField', () => ({
            selected: null,

            select(id) {
                this.selected = id
            }
        }))
    })
</script>
{{ /push:scripts }}
