<!doctype html>
<html lang="{{ site:short_locale }}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ title }} | {{ site_config:site_name }}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ mix src='css/tailwind.css' }}">
        {{ partial:blocks/seo }}
    </head>
    <body class="bg-background bg-opacity-20 font-sans leading-normal text-txtcolor">
        <div class="xl:container xl:mx-auto my-4 xl:my-8 flex flex-col items-center justify-center bg-container rounded shadow">
            {{ partial:blocks/header }}
            {{ builder }}
                {{ partial src="builder/{type}" }}
            {{ /builder }}
        </div>
        {{ stack:scripts }}
        <script src="{{ mix src='/js/site.js' }}"></script>

        {{ partial:blocks/colors }}
    </body>    
</html>
