title: Pages
sections:
  main:
    display: Main
    fields:
      -
        handle: title
        field:
          type: text
          required: true
          validate:
            - required
      -
        handle: builder
        field:
          collapse: false
          sets:
            heading:
              display: Heading
              fields:
                -
                  handle: heading
                  field:
                    restrict: false
                    automatic_line_breaks: true
                    automatic_links: false
                    escape_markup: false
                    smartypants: false
                    antlers: false
                    display: Heading
                    type: markdown
                    icon: markdown
                    listable: hidden
                    instructions_position: above
                    read_only: false
            intro_text:
              display: 'Intro text'
              fields:
                -
                  handle: text
                  field:
                    always_show_set_button: false
                    buttons:
                      - h2
                      - h3
                      - bold
                      - italic
                      - unorderedlist
                      - orderedlist
                      - removeformat
                      - quote
                      - anchor
                      - image
                      - table
                    save_html: false
                    toolbar_mode: fixed
                    link_noopener: false
                    link_noreferrer: false
                    target_blank: false
                    reading_time: false
                    fullscreen: true
                    allow_source: true
                    enable_input_rules: true
                    enable_paste_rules: true
                    antlers: false
                    display: Text
                    type: bard
                    icon: bard
                    listable: hidden
                    instructions_position: above
                    read_only: false
            image_slider:
              display: 'Image slider'
              fields:
                -
                  handle: images
                  field:
                    mode: grid
                    container: assets
                    restrict: false
                    allow_uploads: true
                    show_filename: true
                    display: Images
                    type: assets
                    icon: assets
                    listable: hidden
                    instructions_position: above
                    read_only: false
                -
                  handle: title
                  field:
                    restrict: false
                    automatic_line_breaks: true
                    automatic_links: false
                    escape_markup: false
                    smartypants: false
                    antlers: false
                    display: Title
                    type: markdown
                    icon: markdown
                    listable: hidden
                    instructions_position: above
                    read_only: false
            form:
              display: Form
              fields:
                -
                  handle: form_field
                  field:
                    max_items: 1
                    display: 'Form Field'
                    type: form
                    icon: form
                    listable: hidden
                    instructions_position: above
                    read_only: false
                -
                  handle: title
                  field:
                    restrict: false
                    automatic_line_breaks: true
                    automatic_links: false
                    escape_markup: false
                    smartypants: false
                    antlers: false
                    display: Title
                    type: markdown
                    icon: markdown
                    listable: hidden
                    instructions_position: above
                    read_only: false
            simple_grid:
              display: 'Simple grid'
              fields:
                -
                  handle: items
                  field:
                    fields:
                      -
                        handle: label
                        field:
                          restrict: false
                          automatic_line_breaks: true
                          automatic_links: false
                          escape_markup: false
                          smartypants: false
                          antlers: false
                          display: Label
                          type: markdown
                          icon: markdown
                          listable: hidden
                          instructions_position: above
                          read_only: false
                      -
                        handle: background
                        field:
                          mode: list
                          container: assets
                          restrict: false
                          allow_uploads: true
                          show_filename: true
                          max_files: 1
                          display: Background
                          type: assets
                          icon: assets
                          listable: hidden
                          instructions_position: above
                          read_only: false
                      -
                        handle: link
                        field:
                          container: assets
                          display: Link
                          type: link
                          icon: link
                          listable: hidden
                          instructions_position: above
                          read_only: false
                    mode: stacked
                    reorderable: true
                    display: Items
                    type: grid
                    icon: grid
                    listable: hidden
                    instructions_position: above
                    read_only: false
                -
                  handle: grid_container_class
                  field:
                    input_type: text
                    antlers: false
                    display: 'Grid container class'
                    type: text
                    icon: text
                    listable: hidden
                    instructions_position: above
                    read_only: false
                -
                  handle: title
                  field:
                    restrict: false
                    automatic_line_breaks: true
                    automatic_links: false
                    escape_markup: false
                    smartypants: false
                    antlers: false
                    display: Title
                    type: markdown
                    icon: markdown
                    listable: hidden
                    instructions_position: above
                    read_only: false
            contact_details:
              display: 'Contact details'
              fields:
                -
                  handle: title
                  field:
                    restrict: false
                    automatic_line_breaks: true
                    automatic_links: false
                    escape_markup: false
                    smartypants: false
                    antlers: false
                    display: Title
                    type: markdown
                    icon: markdown
                    instructions: 'Contact details are in global settings. This is a placeholder in order to place it in the homepage.'
                    listable: hidden
                    instructions_position: above
                    read_only: false
            icons:
              display: Icons
              fields:
                -
                  handle: title
                  field:
                    restrict: false
                    automatic_line_breaks: true
                    automatic_links: false
                    escape_markup: false
                    smartypants: false
                    antlers: false
                    display: Title
                    type: markdown
                    icon: markdown
                    listable: hidden
                    instructions_position: above
                    read_only: false
                -
                  handle: icons
                  field:
                    fields:
                      -
                        handle: icon
                        field:
                          mode: list
                          container: assets
                          restrict: false
                          allow_uploads: true
                          show_filename: true
                          max_files: 1
                          display: Icon
                          type: assets
                          icon: assets
                          listable: hidden
                          instructions_position: above
                          read_only: false
                      -
                        handle: label
                        field:
                          input_type: text
                          antlers: false
                          display: Label
                          type: text
                          icon: text
                          listable: hidden
                          instructions_position: above
                          read_only: false
                    mode: table
                    reorderable: true
                    display: Icons
                    type: grid
                    icon: grid
                    listable: hidden
                    instructions_position: above
                    read_only: false
            features:
              display: Features
              fields:
                -
                  handle: title
                  field:
                    restrict: false
                    automatic_line_breaks: true
                    automatic_links: false
                    escape_markup: false
                    smartypants: false
                    antlers: false
                    display: Title
                    type: markdown
                    icon: markdown
                    listable: hidden
                    instructions_position: above
                    read_only: false
                -
                  handle: feature_list
                  field:
                    mode: dynamic
                    display: 'Feature list'
                    type: array
                    icon: array
                    listable: hidden
                    instructions_position: above
                    read_only: false
          display: Builder
          type: replicator
          icon: replicator
          listable: hidden
          instructions_position: above
          read_only: false
  sidebar:
    display: Sidebar
    fields:
      -
        handle: slug
        field:
          type: slug
          localizable: true
      -
        handle: template
        field:
          type: template
          display: Template
          localizable: true
      -
        handle: parent
        field:
          type: entries
          collections:
            - pages
          max_items: 1
          listable: false
          localizable: true
