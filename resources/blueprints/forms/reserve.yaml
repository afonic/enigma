sections:
  main:
    display: Main
    fields:
      -
        handle: full_name
        field:
          input_type: text
          antlers: false
          display: 'Full name'
          type: text
          icon: text
          listable: hidden
          instructions_position: above
          read_only: false
          validate:
            - required
          width: 50
      -
        handle: email
        field:
          input_type: text
          antlers: false
          display: Email
          type: text
          icon: text
          listable: hidden
          instructions_position: above
          read_only: false
          validate:
            - required
            - email
          width: 50
      -
        handle: phone
        field:
          input_type: text
          append: optional
          antlers: false
          display: Phone
          type: text
          icon: text
          listable: hidden
          instructions_position: above
          read_only: false
          width: 50
      -
        handle: persons
        field:
          input_type: text
          antlers: false
          display: Persons
          type: text
          icon: text
          width: 50
          listable: hidden
          instructions_position: above
          read_only: false
          validate:
            - required
      -
        handle: date
        field:
          input_type: date
          antlers: false
          display: 'Starting date'
          type: text
          icon: text
          listable: hidden
          instructions_position: above
          read_only: false
          validate:
            - required
      -
        handle: comments
        field:
          antlers: false
          display: Comments
          type: textarea
          icon: textarea
          listable: hidden
          instructions_position: above
          read_only: false
      -
        handle: privacy
        field:
          inline: false
          options:
            agree: 'I consent for the processing of my personal data provided above by Enigma Yachting'
          display: Privacy
          type: checkboxes
          icon: checkboxes
          instructions: hide_display
          listable: hidden
          instructions_position: above
          read_only: false
          validate:
            - required
